name: Studio CAD assets

on:
  pull_request:
    paths:
      - "scripts/generate-studio-cad.py"
      - "scripts/check-studio-cad.py"
      - "tools/cad/requirements.txt"
      - "apps/web/public/assets/models/studio/**"
  push:
    branches: [main, develop]
    paths:
      - "scripts/generate-studio-cad.py"
      - "scripts/check-studio-cad.py"
      - "tools/cad/requirements.txt"
      - "apps/web/public/assets/models/studio/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cad/requirements.txt
      - name: Install CAD toolchain
        run: python -m pip install --requirement tools/cad/requirements.txt
      - name: Regenerate canonical variants
        run: python scripts/generate-studio-cad.py --output-dir .cad-assets
      - name: Validate regenerated variants
        run: python scripts/check-studio-cad.py --asset-dir .cad-assets
