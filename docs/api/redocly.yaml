extends:
  - recommended

rules:
  # API.md provides the human endpoint summary table; operationId remains the
  # stable machine identifier in the design contract.
  operation-summary: off
  # Authentication is global and documented in API.md. Collection reads that
  # omit an explicit 4xx still inherit authentication/rate-limit behavior.
  operation-4xx-response: off
  info-license: off
  tag-description: off

