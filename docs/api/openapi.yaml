openapi: 3.1.0
info:
  title: AI Estimate Studio API
  version: 1.0.0-design
  description: Normative pre-implementation contract. Amount fields are integer minor units encoded as strings.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: example.invalid }
tags:
  - { name: PublicCatalog }
  - { name: Configuration }
  - { name: Quote }
  - { name: AdminOrganization }
  - { name: AdminCatalog }
  - { name: AdminAssets }
  - { name: AdminPricing }
  - { name: AdminOperations }
paths:
  /health:
    servers:
      - url: https://{host}/api
        variables:
          host: { default: example.invalid }
    get:
      summary: Check process health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is running; no dependency or secret detail is exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /categories:
    get:
      operationId: listPublicCategories
      tags: [PublicCatalog]
      security: []
      parameters: [{$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': { description: Published categories, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPage' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /categories/{slug}:
    get:
      operationId: getPublicCategory
      tags: [PublicCatalog]
      security: []
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Locale'}]
      responses:
        '200': { description: Published category, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /products:
    get:
      operationId: listPublicProducts
      tags: [PublicCatalog]
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Locale' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Published products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
  /products/{slug}:
    get:
      operationId: getPublicProduct
      tags: [PublicCatalog]
      security: []
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Locale'}]
      responses:
        '200': { description: Current published product revision, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /configurations:
    post:
      operationId: createConfiguration
      tags: [Configuration]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateConfigurationRequest' } } } }
      responses:
        '201':
          description: Configuration created; also sets the configuration session cookie.
          headers: { Set-Cookie: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Configuration' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /configurations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getConfiguration
      tags: [Configuration]
      security: [{ ConfigurationSession: [] }]
      responses:
        '200': { description: Active configuration, content: { application/json: { schema: { $ref: '#/components/schemas/Configuration' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Expired' }
    patch:
      operationId: updateConfiguration
      tags: [Configuration]
      security: [{ ConfigurationSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateConfigurationRequest' } } } }
      responses:
        '200': { description: Normalized configuration and authoritative price, content: { application/json: { schema: { $ref: '#/components/schemas/Configuration' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /configurations/{id}/recommendations:
    post:
      operationId: createRecommendation
      tags: [Configuration]
      security: [{ ConfigurationSession: [] }]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRequest' } } } }
      responses:
        '201': { description: Verified recommendation, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /quotes:
    post:
      operationId: issueQuote
      tags: [Quote]
      security: [{ ConfigurationSession: [] }]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IssueQuoteRequest' } } } }
      responses:
        '202': { description: Quote issued; PDF may still be pending, content: { application/json: { schema: { $ref: '#/components/schemas/QuotePublicView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /public/quotes/{token}:
    get:
      operationId: getPublicQuote
      tags: [Quote]
      security: []
      parameters: [{$ref: '#/components/parameters/PublicToken'}]
      responses:
        '200': { description: Public quote snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/QuotePublicView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
  /public/quotes/{token}/pdf:
    get:
      operationId: downloadPublicQuotePdf
      tags: [Quote]
      security: []
      parameters: [{$ref: '#/components/parameters/PublicToken'}]
      responses:
        '302': { description: Redirect to a short-lived signed object URL, headers: { Location: { required: true, schema: { type: string, format: uri } } } }
        '202': { description: PDF still generating, content: { application/json: { schema: { $ref: '#/components/schemas/JobStatus' } } } }
        '410': { $ref: '#/components/responses/Expired' }
  /admin/organization:
    get:
      operationId: getAdminOrganization
      tags: [AdminOrganization]
      responses: { '200': { description: Organization settings, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettings' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      operationId: updateAdminOrganization
      tags: [AdminOrganization]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettingsWrite' } } } }
      responses: { '200': { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettings' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/memberships:
    get:
      operationId: listMemberships
      tags: [AdminOrganization]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Membership page, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: inviteMembership
      tags: [AdminOrganization]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InviteMembershipRequest' } } } }
      responses: { '201': { description: Invitation created, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/memberships/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      operationId: updateMembership
      tags: [AdminOrganization]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipWrite' } } } }
      responses: { '200': { description: Membership updated, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      operationId: suspendMembership
      tags: [AdminOrganization]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: { '204': { description: Membership suspended }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Category page, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryAdminPage' } } } } }
    post:
      operationId: createAdminCategory
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWrite' } } } }
      responses: { '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryAdmin' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/categories/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAdminCategory
      tags: [AdminCatalog]
      responses: { '200': { description: Category, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryAdmin' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateAdminCategory
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWrite' } } } }
      responses: { '200': { description: Category updated, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryAdmin' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      operationId: archiveAdminCategory
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: { '204': { description: Category archived }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Product page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductAdminPage' } } } } }
    post:
      operationId: createAdminProduct
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProductRequest' } } } }
      responses: { '201': { description: Product and first draft, content: { application/json: { schema: { $ref: '#/components/schemas/ProductAdmin' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/products/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAdminProduct
      tags: [AdminCatalog]
      responses: { '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductAdmin' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateAdminProduct
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductWrite' } } } }
      responses: { '200': { description: Product updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductAdmin' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/products/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listProductRevisions
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Product revision page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRevisionPage' } } } } }
    post:
      operationId: createProductRevision
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRevisionRequest' } } } }
      responses: { '201': { description: Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRevisionDraft' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/product-revisions/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getProductRevision
      tags: [AdminCatalog]
      responses: { '200': { description: Complete revision aggregate, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRevisionDraft' } } } } }
    patch:
      operationId: updateProductRevision
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRevisionWrite' } } } }
      responses: { '200': { description: Normalized draft, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRevisionDraft' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/product-revisions/{id}/publication:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: publishProductRevision
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationRequest' } } } }
      responses: { '200': { description: Published immutable revision, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRevisionDraft' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      operationId: retireProductRevision
      tags: [AdminCatalog]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: { '204': { description: Revision retired }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/assets:
    get:
      operationId: listAssets
      tags: [AdminAssets]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Asset page, content: { application/json: { schema: { $ref: '#/components/schemas/AssetPage' } } } } }
  /admin/assets/uploads:
    post:
      operationId: createAssetUpload
      tags: [AdminAssets]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetUploadRequest' } } } }
      responses: { '201': { description: Signed upload intent, content: { application/json: { schema: { $ref: '#/components/schemas/UploadIntent' } } } }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/assets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAsset
      tags: [AdminAssets]
      responses: { '200': { description: Asset metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } } }
    delete:
      operationId: archiveAsset
      tags: [AdminAssets]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: { '204': { description: Asset archived }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/assets/{id}/upload-completion:
    post:
      operationId: completeAssetUpload
      tags: [AdminAssets]
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetUploadCompletion' } } } }
      responses: { '202': { description: Asset accepted for processing, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/pricing-rule-sets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getPricingRuleSet
      tags: [AdminPricing]
      responses: { '200': { description: Pricing rule set, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleSet' } } } } }
    patch:
      operationId: updatePricingRuleSet
      tags: [AdminPricing]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleSetWrite' } } } }
      responses: { '200': { description: Updated draft, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleSet' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/pricing-rule-sets/{id}/simulations:
    post:
      operationId: simulatePricing
      tags: [AdminPricing]
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingScenario' } } } }
      responses: { '200': { description: Price and admin trace, content: { application/json: { schema: { $ref: '#/components/schemas/PricingSimulation' } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/pricing-rule-sets/{id}/publication:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: publishPricingRuleSet
      tags: [AdminPricing]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationRequest' } } } }
      responses: { '200': { description: Published rule set, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleSet' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      operationId: retirePricingRuleSet
      tags: [AdminPricing]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: { '204': { description: Rule set retired }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/quotes:
    get:
      operationId: listAdminQuotes
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Quote page, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteAdminPage' } } } } }
  /admin/quotes/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAdminQuote
      tags: [AdminOperations]
      responses: { '200': { description: Immutable quote detail, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteAdmin' } } } } }
    patch:
      operationId: updateAdminQuoteStatus
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteStatusWrite' } } } }
      responses: { '200': { description: Quote status updated, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteAdmin' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Customer page, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } } }
  /admin/customers/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getAdminCustomer
      tags: [AdminOperations]
      responses: { '200': { description: Customer and quote history, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } } }
    patch:
      operationId: updateAdminCustomer
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerWrite' } } } }
      responses: { '200': { description: Customer updated, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/customers/{id}/privacy-requests:
    post:
      operationId: createPrivacyRequest
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } } }
      responses: { '202': { description: Privacy job accepted, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Audit page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/jobs:
    get:
      operationId: listJobs
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { description: Job page, content: { application/json: { schema: { $ref: '#/components/schemas/JobPage' } } } } }
  /admin/jobs/{id}/retries:
    post:
      operationId: retryJob
      tags: [AdminOperations]
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses: { '202': { description: Retry accepted, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
components:
  securitySchemes:
    AdminSession: { type: apiKey, in: cookie, name: authjs.session-token }
    ConfigurationSession: { type: apiKey, in: cookie, name: aes.configuration-session }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Slug: { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
    PublicToken: { name: token, in: path, required: true, schema: { type: string, minLength: 32, maxLength: 256 } }
    Locale: { name: locale, in: query, schema: { type: string, default: en } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
  responses:
    Unauthorized: { description: Authentication required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Insufficient permission, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Resource not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Version or domain conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Expired: { description: Resource expired or revoked, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ValidationError: { description: Validation failed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
